name: Ansible Configuration Automation

on:
  push:
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Check inventory
        run: ansible-inventory -i inventory/hosts.ini --list

      - name: Run automation
        run: ansible-playbook -i inventory/hosts.ini playbooks/configure.yml